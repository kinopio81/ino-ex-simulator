<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <rect width="320" height="200" fill="#f4f1ea"/>
  <!-- 절단된 패널 (왼쪽은 원래 길이, 오른쪽은 절단면) -->
  <rect x="24" y="48" width="200" height="104" fill="#f8f6f1" stroke="#2a2a2a" stroke-width="2"/>
  <g fill="#2a2a2a">
    <rect x="24" y="48" width="200" height="8"/>
    <rect x="24" y="144" width="200" height="8"/>
    <rect x="24" y="64" width="200" height="9"/>
    <rect x="24" y="80" width="200" height="9"/>
    <rect x="24" y="96" width="200" height="9"/>
    <rect x="24" y="112" width="200" height="9"/>
    <rect x="24" y="128" width="200" height="9"/>
  </g>
  <line x1="224" y1="40" x2="224" y2="160" stroke="#b03a2c" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="224" y="34" text-anchor="middle" font-size="12" font-weight="700" fill="#b03a2c" font-family="sans-serif">절단면</text>
  <!-- 단부 커버: 절단면에 끼우는 ㄷ자 커버 -->
  <path d="M232 44 h26 v112 h-26 v-10 h16 v-92 h-16 z" fill="#8a8f8c" stroke="#3f4542" stroke-width="1.5"/>
  <path d="M262 100 h26" stroke="#1d5a47" stroke-width="2.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1d5a47"/></marker></defs>
  <text x="300" y="92" text-anchor="end" font-size="11" fill="#1d5a47" font-family="sans-serif">단부 커버</text>
  <text x="300" y="106" text-anchor="end" font-size="11" fill="#1d5a47" font-family="sans-serif">(1세트)</text>
  <text x="160" y="184" text-anchor="middle" font-size="12" fill="#3f4542" font-family="sans-serif">절단한 패널의 절단면을 커버로 마감합니다</text>
</svg>
